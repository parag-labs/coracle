<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="1642" viewBox="0 0 1380 1642" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif"><defs><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2f9e6e"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e05561"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#4285f4"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8b5cf6"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e0a13a"/></marker><marker id="ah-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2aa5b0"/></marker><marker id="ah-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8494ab"/></marker><marker id="ah-white" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#c9d3e2"/></marker><filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1b2a4a" flood-opacity="0.10"/></filter></defs><rect width="1380" height="1642" fill="#fbfcfe"/><text x="690.0" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="#16203a">coracle — leader-election sequence</text><text x="690.0" y="80" text-anchor="middle" font-size="14.5" fill="#6b7794">One Raft election in the order the code runs it: time out, campaign, win a majority, and assert leadership.</text><rect x="76.0" y="118" width="280" height="34" rx="9" fill="#ffffff" stroke="#8494ab" stroke-width="1.6"/><text x="216.0" y="140" text-anchor="middle" font-size="12.6" font-weight="700" fill="#3d4a63">Cluster · driver</text><path d="M216.0,152 V1600.0" stroke="#8494ab" stroke-width="1.4" stroke-dasharray="5 5" stroke-opacity="0.55"/><rect x="392.0" y="118" width="280" height="34" rx="9" fill="#ffffff" stroke="#2f9e6e" stroke-width="1.6"/><text x="532.0" y="140" text-anchor="middle" font-size="12.6" font-weight="700" fill="#186547">Node A · candidate</text><path d="M532.0,152 V1600.0" stroke="#2f9e6e" stroke-width="1.4" stroke-dasharray="5 5" stroke-opacity="0.55"/><rect x="708.0" y="118" width="280" height="34" rx="9" fill="#ffffff" stroke="#4285f4" stroke-width="1.6"/><text x="848.0" y="140" text-anchor="middle" font-size="12.6" font-weight="700" fill="#17509f">Node B · follower</text><path d="M848.0,152 V1600.0" stroke="#4285f4" stroke-width="1.4" stroke-dasharray="5 5" stroke-opacity="0.55"/><rect x="1024.0" y="118" width="280" height="34" rx="9" fill="#ffffff" stroke="#2aa5b0" stroke-width="1.6"/><text x="1164.0" y="140" text-anchor="middle" font-size="12.6" font-weight="700" fill="#136b74">Node C · follower</text><path d="M1164.0,152 V1600.0" stroke="#2aa5b0" stroke-width="1.4" stroke-dasharray="5 5" stroke-opacity="0.55"/><rect x="72" y="182" width="1236" height="30" rx="9" fill="#8494ab" fill-opacity="0.10"/><text x="690" y="202" text-anchor="middle" font-size="12.4" font-weight="700" letter-spacing="0.5" fill="#3d4a63">ELECTION TIMEOUT — THE CLUSTER OWNS TIME AND THE NETWORK</text><text x="374" y="243" text-anchor="middle" font-size="12.9" font-weight="700" fill="#3d4a63">tick()  × N</text><path d="M228,254 L520,254" stroke="#8494ab" stroke-width="2.1" fill="none" marker-end="url(#ah-slate)"/><text x="374" y="272" text-anchor="middle" font-size="11.4" fill="#6b7794">election_elapsed += 1 each step()</text><rect x="80.0" y="310" width="1220.0" height="76.8" rx="11" fill="#eef1f6" stroke="#8494ab" stroke-width="1.4" stroke-opacity="0.8"/><text x="96.0" y="334" font-size="13.2" font-weight="700" fill="#3d4a63">Why this replays identically every run</text><text x="96.0" y="356" font-size="12.4" fill="#3d4a63" fill-opacity="0.92">A RaftNode never reads a clock or a socket. Cluster.step() delivers the inbox to node.handle(), ticks every node, and re-enqueues the replies.</text><text x="96.0" y="374.4" font-size="12.4" fill="#3d4a63" fill-opacity="0.92">Timeouts are staggered in [T, 2T) so two followers rarely campaign in the same tick — the paper's fix for a split vote.</text><path d="M544,417 h30 a11 11 0 0 1 11 11 v8 a11 11 0 0 1 -11 11 h-30" stroke="#2f9e6e" stroke-width="2.1" fill="none" marker-end="url(#ah-green)"/><text x="590" y="418" text-anchor="start" font-size="12.9" font-weight="700" fill="#186547">_become_candidate()</text><text x="590" y="437" text-anchor="start" font-size="11.4" fill="#6b7794">current_term += 1  ·  vote for self</text><text x="590" y="453" text-anchor="start" font-size="11.4" fill="#6b7794">role → CANDIDATE</text><rect x="72" y="475" width="1236" height="30" rx="9" fill="#4285f4" fill-opacity="0.10"/><text x="690" y="495" text-anchor="middle" font-size="12.4" font-weight="700" letter-spacing="0.5" fill="#17509f">CAMPAIGN FOR VOTES</text><text x="690" y="536" text-anchor="middle" font-size="12.9" font-weight="700" fill="#186547">RequestVote</text><path d="M544,547 L836,547" stroke="#2f9e6e" stroke-width="2.1" fill="none" marker-end="url(#ah-green)"/><text x="690" y="565" text-anchor="middle" font-size="11.4" fill="#6b7794">term · lastLogIndex · lastLogTerm</text><circle cx="532.0" cy="546.8" r="13" fill="#ffffff" stroke="#2f9e6e" stroke-width="1.8"/><text x="532.0" y="551.4" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2f9e6e">1</text><text x="848" y="610" text-anchor="middle" font-size="12.9" font-weight="700" fill="#186547">RequestVote</text><path d="M544,621 L1152,621" stroke="#2f9e6e" stroke-width="2.1" fill="none" marker-end="url(#ah-green)"/><text x="848" y="639" text-anchor="middle" font-size="11.4" fill="#6b7794">term · lastLogIndex · lastLogTerm</text><circle cx="532.0" cy="620.8" r="13" fill="#ffffff" stroke="#2f9e6e" stroke-width="1.8"/><text x="532.0" y="625.4" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2f9e6e">2</text><rect x="398" y="669" width="900" height="243" rx="12" fill="#e0a13a" fill-opacity="0.05" stroke="#e0a13a" stroke-width="1.5" stroke-dasharray="7 5"/><rect x="398" y="669" width="250" height="23" rx="9" fill="#e0a13a" fill-opacity="0.16"/><text x="411" y="685" font-size="12" font-weight="700" fill="#8c5a0d">grant a vote only when all three hold</text><rect x="414.0" y="718.8" width="868.0" height="73.19999999999999" rx="11" fill="#fdf1d6" stroke="#e0a13a" stroke-width="1.4" stroke-opacity="0.8"/><text x="430.0" y="742.8" font-size="12.4" fill="#8c5a0d" fill-opacity="0.92">term ≥ currentTerm, and we have not already voted this term,</text><text x="430.0" y="761.1999999999999" font-size="12.4" fill="#8c5a0d" fill-opacity="0.92">and the candidate's log is at least as up-to-date as ours:</text><text x="430.0" y="779.5999999999999" font-size="12.4" fill="#8c5a0d" fill-opacity="0.92">higher lastLogTerm wins; on a tie the longer log wins.</text><text x="690" y="811" text-anchor="middle" font-size="12.9" font-weight="700" fill="#17509f">granted</text><path d="M836,822 L544,822" stroke="#4285f4" stroke-width="2.1" fill="none" marker-end="url(#ah-blue)" stroke-dasharray="7 5"/><circle cx="848.0" cy="822.0" r="13" fill="#ffffff" stroke="#4285f4" stroke-width="1.8"/><text x="848.0" y="826.6" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4285f4">3</text><text x="848" y="869" text-anchor="middle" font-size="12.9" font-weight="700" fill="#136b74">granted</text><path d="M1152,880 L544,880" stroke="#2aa5b0" stroke-width="2.1" fill="none" marker-end="url(#ah-cyan)" stroke-dasharray="7 5"/><circle cx="1164.0" cy="880.0" r="13" fill="#ffffff" stroke="#2aa5b0" stroke-width="1.8"/><text x="1164.0" y="884.6" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2aa5b0">4</text><rect x="396.0" y="934.0" width="904.0" height="76.8" rx="11" fill="#fde5e7" stroke="#e05561" stroke-width="1.4" stroke-opacity="0.8"/><text x="412.0" y="958.0" font-size="13.2" font-weight="700" fill="#9e2b36">Term alone does not win an election</text><text x="412.0" y="980.0" font-size="12.4" fill="#9e2b36" fill-opacity="0.92">A higher term makes the voter step down to that term first — but the vote is still denied if the candidate's log is behind.</text><text x="412.0" y="998.4" font-size="12.4" fill="#9e2b36" fill-opacity="0.92">That election restriction is what stops a node that never saw a committed entry from ever being elected over it.</text><rect x="72" y="1019" width="1236" height="30" rx="9" fill="#2f9e6e" fill-opacity="0.10"/><text x="690" y="1039" text-anchor="middle" font-size="12.4" font-weight="700" letter-spacing="0.5" fill="#186547">REACH A MAJORITY, THEN ASSERT LEADERSHIP</text><path d="M544,1091 h30 a11 11 0 0 1 11 11 v8 a11 11 0 0 1 -11 11 h-30" stroke="#2f9e6e" stroke-width="2.1" fill="none" marker-end="url(#ah-green)"/><text x="590" y="1092" text-anchor="start" font-size="12.9" font-weight="700" fill="#186547">_become_leader()</text><text x="590" y="1111" text-anchor="start" font-size="11.4" fill="#6b7794">votes ≥ (peers + 1) // 2 + 1</text><text x="590" y="1127" text-anchor="start" font-size="11.4" fill="#6b7794">A's own vote already counts</text><text x="690" y="1160" text-anchor="middle" font-size="12.9" font-weight="700" fill="#186547">AppendEntries</text><path d="M544,1171 L836,1171" stroke="#2f9e6e" stroke-width="2.1" fill="none" marker-end="url(#ah-green)"/><text x="690" y="1189" text-anchor="middle" font-size="11.4" fill="#6b7794">prevLog* · entries=[] · leaderCommit</text><circle cx="532.0" cy="1170.8" r="13" fill="#ffffff" stroke="#2f9e6e" stroke-width="1.8"/><text x="532.0" y="1175.3999999999999" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2f9e6e">5</text><text x="848" y="1234" text-anchor="middle" font-size="12.9" font-weight="700" fill="#186547">AppendEntries</text><path d="M544,1245 L1152,1245" stroke="#2f9e6e" stroke-width="2.1" fill="none" marker-end="url(#ah-green)"/><text x="848" y="1263" text-anchor="middle" font-size="11.4" fill="#6b7794">prevLog* · entries=[] · leaderCommit</text><circle cx="532.0" cy="1244.8" r="13" fill="#ffffff" stroke="#2f9e6e" stroke-width="1.8"/><text x="532.0" y="1249.3999999999999" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2f9e6e">6</text><text x="690" y="1308" text-anchor="middle" font-size="12.9" font-weight="700" fill="#17509f">AppendEntriesReply</text><path d="M836,1319 L544,1319" stroke="#4285f4" stroke-width="2.1" fill="none" marker-end="url(#ah-blue)" stroke-dasharray="7 5"/><text x="690" y="1337" text-anchor="middle" font-size="11.4" fill="#6b7794">success = true</text><circle cx="848.0" cy="1318.8" r="13" fill="#ffffff" stroke="#4285f4" stroke-width="1.8"/><text x="848.0" y="1323.3999999999999" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4285f4">7</text><text x="848" y="1382" text-anchor="middle" font-size="12.9" font-weight="700" fill="#136b74">AppendEntriesReply</text><path d="M1152,1393 L544,1393" stroke="#2aa5b0" stroke-width="2.1" fill="none" marker-end="url(#ah-cyan)" stroke-dasharray="7 5"/><text x="848" y="1411" text-anchor="middle" font-size="11.4" fill="#6b7794">success = true</text><circle cx="1164.0" cy="1392.8" r="13" fill="#ffffff" stroke="#2aa5b0" stroke-width="1.8"/><text x="1164.0" y="1397.3999999999999" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2aa5b0">8</text><rect x="62.0" y="1448.8" width="616.0" height="95.19999999999999" rx="11" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.4" stroke-opacity="0.8"/><text x="78.0" y="1472.8" font-size="13.2" font-weight="700" fill="#186547">Election safety: one leader per term</text><text x="78.0" y="1494.8" font-size="12.4" fill="#186547" fill-opacity="0.92">handle() adopts any higher term as a follower before</text><text x="78.0" y="1513.2" font-size="12.4" fill="#186547" fill-opacity="0.92">doing anything else, and a node votes at most once per</text><text x="78.0" y="1531.6000000000001" font-size="12.4" fill="#186547" fill-opacity="0.92">term, so two leaders can never share a term.</text><rect x="702.0" y="1448.8" width="616.0" height="95.19999999999999" rx="11" fill="#fdf1d6" stroke="#e0a13a" stroke-width="1.4" stroke-opacity="0.8"/><text x="718.0" y="1472.8" font-size="13.2" font-weight="700" fill="#8c5a0d">A single-node cluster wins but never commits</text><text x="718.0" y="1494.8" font-size="12.4" fill="#8c5a0d" fill-opacity="0.92">With no peers, _start_election() calls _become_leader()</text><text x="718.0" y="1513.2" font-size="12.4" fill="#8c5a0d" fill-opacity="0.92">at once and sends nothing. commit_index only advances on</text><text x="718.0" y="1531.6000000000001" font-size="12.4" fill="#8c5a0d" fill-opacity="0.92">AppendEntries replies — so a lone node's proposal never commits.</text><text x="690.0" y="1624" text-anchor="middle" font-size="12" fill="#6b7794">parag-labs/coracle</text></svg>